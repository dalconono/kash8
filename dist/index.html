<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2eb">
<title>Kash8 — Money decisions in chat</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#1e2420;background:#f4f2eb;--green:#d8fc7f;--ink:#1e2420;--muted:#555e52;--line:#d6d9cc}
*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #55761a;outline-offset:3px}
header.top{max-width:1260px;margin:auto;padding:24px clamp(18px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:31px;font-weight:850;letter-spacing:-.09em}.brand span{color:#547320}.top a{font-size:14px;text-underline-offset:4px}
main{max-width:1260px;margin:auto;padding:28px clamp(18px,5vw,64px) 50px}.layout{display:grid;grid-template-columns:.92fr 1.08fr;gap:clamp(24px,5vw,75px);align-items:start}h1{font-size:clamp(53px,7.25vw,102px);line-height:.92;letter-spacing:-.085em;margin:12px 0 21px}p{line-height:1.55}.intro>p{color:var(--muted);max-width:435px;font-size:17px;margin-bottom:25px}.scenarios{display:grid;gap:9px}.scenario{width:100%;text-align:left;border:1px solid var(--line);background:#faf9f3;color:var(--ink);padding:13px;border-radius:16px;display:grid;align-items:center;grid-template-columns:36px 1fr auto;gap:12px;transition:background .2s,transform .2s}.scenario:hover{transform:translateY(-2px)}.scenario[aria-pressed=true]{background:var(--green);border-color:#9bbd4c}.num{height:33px;display:grid;place-items:center;border-radius:50%;background:#e7e8dc;font-size:13px;font-weight:750}.scenario[aria-pressed=true] .num{background:#bedf67}.scenario strong,.scenario small{display:block}.scenario small{color:#485143;margin-top:2px}.arrow{font-size:19px}
.phone{background:#19251d;border-radius:29px;padding:13px;color:#f5f7ef;box-shadow:0 24px 46px #26392420;min-width:0}.heading{display:flex;gap:11px;align-items:center;padding:9px 8px 15px}.avatar{display:grid;place-items:center;background:var(--green);color:#25311a;border-radius:50%;width:38px;height:38px;font-weight:800}.heading small{display:block;color:#c1ccbb;margin-top:2px}.transcript{background:#e7ebdc;color:var(--ink);border-radius:18px;padding:14px;min-height:430px;max-height:585px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.bubble{background:#fcfdf7;border-radius:15px;padding:11px 13px;max-width:96%;font-size:14px;line-height:1.47}.question{align-self:flex-end;background:#dafa9d;max-width:87%}.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}.step{font-size:12px;color:#40523b;padding:4px 6px}.step::before{content:"✓ ";font-weight:bold}.result{animation:enter .28s ease-out;width:96%}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.result h2{font-size:19px;margin:0 0 6px;letter-spacing:-.025em}.result dl{margin:10px 0}.result dl div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #dde2d4;padding:5px 0}.result dd{margin:0;text-align:right;font-weight:720}.result details{margin-top:8px}.result summary{cursor:pointer;font-weight:700}.result details p{padding-top:6px}.composer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 3px 0}.composer span{font-size:12px;color:#d1d9cc}.composer button{border:0;border-radius:30px;background:var(--green);color:var(--ink);padding:8px 12px;font-weight:750}.composer button:disabled{opacity:.55;cursor:wait}
@media(max-width:760px){main{padding-top:5px}.layout{grid-template-columns:1fr}.transcript{min-height:330px;max-height:520px}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><span class="brand">kash<span>8</span></span><a href="calculator.html">Budget calculator</a></header>
<main><div class="layout">
<section class="intro" aria-labelledby="title">
<h1 id="title">Think it through.<br>Then spend.</h1>
<p>Try three conversations that show how Kash8 could help you make a money decision.</p>
<div class="scenarios" role="group" aria-label="Choose a demo conversation">
<button class="scenario" data-case="lease" aria-pressed="true"><span class="num" aria-hidden="true">01</span><span><strong>Can I afford this lease?</strong><small>Deposit, running costs and monthly budget</small></span><span class="arrow" aria-hidden="true">↗</span></button>
<button class="scenario" data-case="dinner" aria-pressed="false"><span class="num" aria-hidden="true">02</span><span><strong>Can I go out both nights?</strong><small>End-of-month spending and a cheaper option</small></span><span class="arrow" aria-hidden="true">↗</span></button>
<button class="scenario" data-case="health" aria-pressed="false"><span class="num" aria-hidden="true">03</span><span><strong>How are my finances looking?</strong><small>Spending trends over one, six and twelve months</small></span><span class="arrow" aria-hidden="true">↗</span></button>
</div></section>
<section class="phone" aria-labelledby="chat-title">
<div class="heading"><span class="avatar" aria-hidden="true">K8</span><div><strong id="chat-title">Kash8</strong><small>Messaging simulator</small></div></div>
<div class="transcript" id="chat" role="log" aria-label="Conversation" aria-live="polite"></div>
<div class="composer"><span>Sample accounts and listings</span><button id="replay" type="button">Replay</button></div>
</section></div></main>
<script type="module">
import { scenarios } from './scenarios.mjs'

const chat = document.getElementById('chat')
const replay = document.getElementById('replay')
const buttons = [...document.querySelectorAll('[data-case]')]
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
let active = 'lease'
let runId = 0
let timer

function element(tag, text, className) {
  const node = document.createElement(tag)
  if (text) node.textContent = text
  if (className) node.className = className
  return node
}

function reply(scenario) {
  const card = element('article', '', 'bubble result')
  card.append(element('h2', scenario.title), element('p', scenario.answer))
  const table = element('dl')
  for (const [label, value] of scenario.rows) {
    const row = element('div')
    row.append(element('dt', label), element('dd', value))
    table.append(row)
  }
  const details = element('details')
  details.append(element('summary', 'See the assumptions'), element('p', scenario.assumptions))
  card.append(table, element('p', scenario.next), details)
  return card
}

function play(key, animate) {
  clearTimeout(timer)
  const current = ++runId
  const scenario = scenarios[key]
  active = key
  for (const button of buttons) {
    button.setAttribute('aria-pressed', String(button.dataset.case === key))
  }
  chat.replaceChildren(element('p', scenario.question, 'bubble question'))
  chat.scrollTop = 0
  const steps = scenario.steps.map((step) => element('div', step, 'step'))
  const sequence = [...steps, reply(scenario)]
  if (!animate || reducedMotion.matches) {
    chat.append(...sequence)
    replay.disabled = false
    return
  }

  replay.disabled = true
  function advance(index) {
    if (current !== runId) return
    chat.append(sequence[index])
    if (index === sequence.length - 1) {
      replay.disabled = false
      return
    }
    timer = setTimeout(() => advance(index + 1), 440)
  }
  timer = setTimeout(() => advance(0), 300)
}
for (const button of buttons) button.addEventListener('click', () => play(button.dataset.case, true))
replay.addEventListener('click', () => play(active, true))
play(active, false)
</script>
</body>
</html>
